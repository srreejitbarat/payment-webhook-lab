spring.application.name=payment-webhook-lab
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
payment.api-key=${PAYMENT_API_KEY}
payment.webhook-secret=${WEBHOOK_SECRET}
outbox.enabled=true
outbox.publisher=log
outbox.max-attempts=5
outbox.poll-delay-ms=1000
outbox.topic=payment-status-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
